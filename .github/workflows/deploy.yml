name: 測試並部署

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 自動測試（含權限測試）
        run: npm test
      - name: 上線前檢查（DEV_MODE、佔位字）
        run: node scripts/preflight.mjs

  deploy-worker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 部署 Cloudflare Worker
        id: wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
      - name: 回報 Worker 網址
        run: echo "::notice title=Worker 網址::${{ steps.wrangler.outputs.deployment-url }}"

  deploy-pages:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: pages
        uses: actions/deploy-pages@v4

  smoke:
    needs: [deploy-worker, deploy-pages]
    runs-on: ubuntu-latest
    steps:
      - name: 部署後檢查（網頁、後端、收盤價來源）
        shell: bash
        run: |
          sleep 20
          fail=0
          p=$(curl -s -o page.html -w "%{http_code}" https://nicolelo418.github.io/nh-ledger/ || echo "curl錯誤$?")
          t=$(grep -o "<title>[^<]*</title>" page.html 2>/dev/null)
          echo "::notice title=網頁::HTTP $p $t"
          [ "$p" = "200" ] || fail=1
          h=$(curl -s -m 60 -w " HTTP %{http_code}" "https://nh-ledger-api.nicole-n.workers.dev/health?sources=1" || echo "curl錯誤$?")
          echo "::notice title=後端健康檢查::$h"
          c=$(curl -s -o /dev/null -w "%{http_code}" https://nh-ledger-api.nicole-n.workers.dev/api/ledger || echo "curl錯誤$?")
          echo "::notice title=未登入讀帳本（應為401）::$c"
          [ "$c" = "401" ] || fail=1
          exit $fail
