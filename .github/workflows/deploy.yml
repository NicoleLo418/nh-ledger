name: 測試並部署

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 自動測試（含權限測試）
        run: npm test
      - name: 上線前檢查（DEV_MODE、佔位字）
        run: node scripts/preflight.mjs

  deploy-worker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 部署 Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy

  deploy-pages:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: pages
        uses: actions/deploy-pages@v4

  smoke:
    needs: [deploy-worker, deploy-pages]
    runs-on: ubuntu-latest
    steps:
      - name: 部署後檢查（網頁、後端、收盤價來源）
        run: |
          sleep 20
          echo "== 網頁 =="
          curl -s -o page.html -w "HTTP %{http_code}\n" https://nicolelo418.github.io/nh-ledger/
          grep -o "<title>[^<]*</title>" page.html || (echo "網頁內容不對" && exit 1)
          echo "== 後端 =="
          curl -s -w "\nHTTP %{http_code}\n" "https://nh-ledger-api.nicole-n.workers.dev/health?sources=1"
          echo "== 未登入呼叫帳本（應該是 401）=="
          code=$(curl -s -o /dev/null -w "%{http_code}" https://nh-ledger-api.nicole-n.workers.dev/api/ledger)
          echo "HTTP $code"; test "$code" = "401"
